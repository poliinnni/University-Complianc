<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд комплаенс-офицера</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #0f172a; padding: 24px; }
        .dashboard { max-width: 1400px; margin: 0 auto; }
        .header { background: white; border-radius: 20px; padding: 20px; margin-bottom: 24px; display: flex; justify-content: space-between; flex-wrap: wrap; align-items: center; }
        .stats { display: flex; gap: 16px; }
        .stat-card { background: #f1f5f9; padding: 8px 20px; border-radius: 40px; font-size: 14px; font-weight: 500; }
        .controls { margin-bottom: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        .btn { background: white; border: 1px solid #cbd5e1; padding: 8px 20px; border-radius: 40px; cursor: pointer; font-weight: 500; }
        .btn-primary { background: #0f2b3d; color: white; border: none; }
        .export-btn { background: #2d6a4f; color: white; border: none; }
        table { width: 100%; background: white; border-radius: 20px; border-collapse: collapse; overflow-x: auto; display: block; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 13px; vertical-align: top; }
        th { background: #f8fafc; font-weight: 600; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; white-space: nowrap; }
        .status-wait { background: #fef3c7; color: #92400e; }
        .status-work { background: #dbeafe; color: #1e40af; }
        .status-verify { background: #e0e7ff; color: #3730a3; }
        .status-rejected { background: #fee2e2; color: #991b1b; }
        .status-resolved { background: #dcfce7; color: #166534; }
        select.status-select { padding: 4px 8px; border-radius: 20px; border: 1px solid #cbd5e1; font-size: 11px; }
        .file-link { background: #eef2ff; padding: 2px 8px; border-radius: 12px; font-size: 11px; cursor: pointer; display: inline-block; margin: 2px; }
        .file-link:hover { background: #cbd5e1; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 24px; padding: 24px; width: 500px; max-width: 90%; }
        .modal-content textarea { width: 100%; padding: 12px; margin: 16px 0; border-radius: 12px; font-family: inherit; }
        footer { text-align: center; margin-top: 24px; color: #94a3b8; font-size: 12px; }
        .api-status { background: #f1f5f9; border-radius: 12px; padding: 8px 16px; font-size: 12px; margin-right: auto; }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="header">
        <h1>📋 Дашборд комплаенс-офицера</h1>
        <div class="stats" id="statsPanel">
            <div class="stat-card">Всего: <span id="totalCount">0</span></div>
            <div class="stat-card">Ожидают: <span id="waitingCount">0</span></div>
            <div class="stat-card">В работе/проверке: <span id="activeCount">0</span></div>
        </div>
    </div>
    <div class="controls">
        <div class="api-status" id="apiStatusMsg">🌐 Данные из MockAPI</div>
        <button class="btn" id="refreshBtn">🔄 Обновить</button>
        <button class="btn export-btn" id="exportExcelBtn">📎 Экспорт Excel</button>
        <button class="btn" id="toggleFilterBtn">🔘 Скрыть завершённые</button>
        <button class="btn" id="clearAllBtn" style="color:#b91c1c;">⚠️ Очистить все (тест)</button>
    </div>
    <div style="overflow-x: auto;">
        <table id="reportsTable" style="min-width: 1000px;">
            <thead>
                <tr><th>Код</th><th>Категория</th><th>Описание</th><th>Дата</th><th>Анонимно</th><th>ФИО</th><th>Файлы</th><th>Статус</th><th>Действия</th></tr>
            </thead>
            <tbody id="reportsBody"><tr><td colspan="9">Загрузка...</td></tr>
            </tbody>
        没关系
    </div>
    <footer>Нажмите на имя файла — в реальной системе будет скачивание. Данные синхронизируются через MockAPI.</footer>
</div>

<div id="resolutionModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">Указать причину или меры</h3>
        <p id="modalHint"></p>
        <textarea id="resolutionText" rows="3" placeholder="Введите текст..."></textarea>
        <input type="hidden" id="modalCode">
        <input type="hidden" id="modalNewStatusKey">
        <button class="btn btn-primary" id="saveResolutionBtn">Сохранить</button>
        <button class="btn" id="closeModalBtn">Отмена</button>
    </div>
</div>

<script>
    const API_BASE = 'https://6a0348792afe8349b4b4f53c.mockapi.io';
    const RESOURCE = 'reports';
    let hideCompleted = false;

    async function fetchReports() {
        try {
            const res = await fetch(`${API_BASE}/${RESOURCE}`);
            if (!res.ok) throw new Error('API error: ' + res.status);
            const data = await res.json();
            return Array.isArray(data) ? data : [];
        } catch (err) {
            console.error(err);
            document.getElementById('apiStatusMsg').innerText = '❌ Ошибка загрузки из API';
            document.getElementById('apiStatusMsg').style.background = '#fee2e2';
            return [];
        }
    }

    async function updateReport(code, data) {
        const res = await fetch(`${API_BASE}/${RESOURCE}/${code}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error('Update failed');
        return res.json();
    }

    async function deleteReport(code) {
        const res = await fetch(`${API_BASE}/${RESOURCE}/${code}`, {
            method: 'DELETE'
        });
        if (!res.ok) throw new Error('Delete failed');
        return res.json();
    }

    async function deleteAllReports() {
        const reports = await fetchReports();
        if (!reports.length) return;
        for (let r of reports) {
            try {
                await deleteReport(r.id);
            } catch(e) {
                console.error('Ошибка удаления', r.id, e);
            }
        }
    }

    async function renderTable() {
        let reports = await fetchReports();
        if (!reports.length) {
            document.getElementById('reportsBody').innerHTML = '<tr><td colspan="9">📭 Нет обращений</td></tr>';
            updateStats([]);
            document.getElementById('apiStatusMsg').innerText = '✅ Данные загружены (пусто)';
            document.getElementById('apiStatusMsg').style.background = '#dcfce7';
            return;
        }
        
        let filtered = [...reports];
        if (hideCompleted) {
            filtered = filtered.filter(r => r.statusKey !== 'rejected' && r.statusKey !== 'resolved');
        }
        
        const tbody = document.getElementById('reportsBody');
        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9">📭 Нет обращений (или все завершённые скрыты)</td></tr>';
            updateStats(reports);
            return;
        }
        
        let html = '';
        for (let r of filtered) {
            const statusClass = `status-${r.statusKey}`;
            const fioDisplay = (r.isAnon === false && r.fio) ? r.fio : '—';
            let filesHtml = '—';
            if (r.attachments && r.attachments.length) {
                filesHtml = r.attachments.map(f => {
                    return `<span class="file-link" onclick="alert('В реальной системе файл «${f.name}» будет доступен для скачивания.')">📎 ${f.name}</span>`;
                }).join('<br>');
            }
            
            const shortDesc = (r.description || '').substring(0, 60);
            const descText = shortDesc + (r.description?.length > 60 ? '…' : '');
            
            html += `<tr>
                <td><code>${r.id}</code></td>
                <td>${r.category || ''}</td>
                <td>${descText}</td>
                <td style="white-space:nowrap">${r.createdAt || ''}</td>
                <td>${r.isAnon ? '🔒 Да' : '👤 Нет'}</td>
                <td>${fioDisplay}</td>
                <td>${filesHtml}</td>
                <td><span class="status-badge ${statusClass}">${r.status}</span></td>
                <td>
                    <select class="status-select" data-code="${r.id}">
                        <option value="waiting" ${r.statusKey === 'waiting' ? 'selected' : ''}>⏳ Ожидает</option>
                        <option value="work" ${r.statusKey === 'work' ? 'selected' : ''}>🔄 В работе</option>
                        <option value="verify" ${r.statusKey === 'verify' ? 'selected' : ''}>🔍 В проверке</option>
                        <option value="rejected" ${r.statusKey === 'rejected' ? 'selected' : ''}>❌ Отклонено</option>
                        <option value="resolved" ${r.statusKey === 'resolved' ? 'selected' : ''}>✅ Меры приняты</option>
                    </select>
                </td>
            </tr>`;
        }
        tbody.innerHTML = html;
        attachStatusEvents();
        updateStats(reports);
        document.getElementById('apiStatusMsg').innerText = '✅ Данные загружены из API';
        document.getElementById('apiStatusMsg').style.background = '#dcfce7';
    }

    function attachStatusEvents() {
        document.querySelectorAll('.status-select').forEach(select => {
            select.removeEventListener('change', statusChangeHandler);
            select.addEventListener('change', statusChangeHandler);
        });
    }

    async function statusChangeHandler(e) {
        const code = e.target.dataset.code;
        const newKey = e.target.value;
        const reports = await fetchReports();
        const report = reports.find(r => r.id === code);
        if (!report) return;
        
        const needReason = (newKey === 'rejected' || newKey === 'resolved');
        if (needReason) {
            document.getElementById('modalCode').value = code;
            document.getElementById('modalNewStatusKey').value = newKey;
            document.getElementById('modalTitle').innerText = newKey === 'rejected' ? '❌ Причина отклонения' : '✅ Принятые меры';
            document.getElementById('modalHint').innerText = newKey === 'rejected' ? 'Укажите причину отклонения' : 'Опишите принятые меры';
            document.getElementById('resolutionText').value = '';
            document.getElementById('resolutionModal').style.display = 'flex';
            return;
        }
        
        let newStatusText = '';
        if (newKey === 'waiting') newStatusText = 'Ожидает внимания комплаенс-офицера';
        else if (newKey === 'work') newStatusText = 'В работе';
        else if (newKey === 'verify') newStatusText = 'В проверке';
        
        report.statusKey = newKey;
        report.status = newStatusText;
        report.updatedAt = new Date().toLocaleString();
        report.resolutionText = null;
        await updateReport(code, report);
        renderTable();
    }

    document.getElementById('saveResolutionBtn').addEventListener('click', async () => {
        const code = document.getElementById('modalCode').value;
        const newKey = document.getElementById('modalNewStatusKey').value;
        const text = document.getElementById('resolutionText').value.trim();
        if (!text) { alert('Заполните поле'); return; }
        
        const reports = await fetchReports();
        const report = reports.find(r => r.id === code);
        if (report) {
            report.statusKey = newKey;
            report.status = newKey === 'rejected' ? 'Отклонено по причине:' : 'Меры приняты';
            report.resolutionText = text;
            report.updatedAt = new Date().toLocaleString();
            await updateReport(code, report);
        }
        document.getElementById('resolutionModal').style.display = 'none';
        renderTable();
    });

    document.getElementById('closeModalBtn').addEventListener('click', () => {
        document.getElementById('resolutionModal').style.display = 'none';
    });
    
    window.addEventListener('click', (e) => {
        const modal = document.getElementById('resolutionModal');
        if (e.target === modal) {
            modal.style.display = 'none';
        }
    });

    async function updateStats(allReports) {
        const total = allReports.length;
        let waiting = 0, active = 0;
        allReports.forEach(r => {
            if (r.statusKey === 'waiting') waiting++;
            if (r.statusKey === 'work' || r.statusKey === 'verify') active++;
        });
        document.getElementById('totalCount').innerText = total;
        document.getElementById('waitingCount').innerText = waiting;
        document.getElementById('activeCount').innerText = active;
    }

    document.getElementById('refreshBtn').addEventListener('click', () => renderTable());
    document.getElementById('toggleFilterBtn').addEventListener('click', () => {
        hideCompleted = !hideCompleted;
        document.getElementById('toggleFilterBtn').innerText = hideCompleted ? '🔘 Показать все' : '🔘 Скрыть завершённые';
        renderTable();
    });
    
    document.getElementById('exportExcelBtn').addEventListener('click', async () => {
        let reports = await fetchReports();
        if (reports.length === 0) { alert('Нет данных для экспорта'); return; }
        let rows = [['Код','Категория','Описание','Дата','Анонимно','ФИО','Статус','Решение','Файлы','Обновлено']];
        for (let r of reports) {
            let files = r.attachments?.map(f => f.name).join('; ') || '';
            let fioValue = (r.isAnon === false && r.fio) ? r.fio : '—';
            rows.push([
                r.id, r.category || '', (r.description || '').replace(/"/g, '""'), 
                r.createdAt || '', r.isAnon ? 'Да' : 'Нет', fioValue, 
                r.status || '', r.resolutionText || '', files, r.updatedAt || ''
            ]);
        }
        const csv = rows.map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');
        const blob = new Blob(["\uFEFF" + csv], {type: 'text/csv;charset=utf-8;'});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'compliance_reports.csv';
        link.click();
        URL.revokeObjectURL(blob);
    });
    
    document.getElementById('clearAllBtn').addEventListener('click', async () => {
        if (confirm('⚠️ Удалить ВСЕ обращения? Это действие необратимо.')) {
            await deleteAllReports();
            renderTable();
        }
    });
    
    renderTable();
</script>
</body>
</html>
